# External save/exit/generate/grade/resume phase; never run beside FSDP on the same GPUs.
# generation_sft owns the phase schedule; an execution-qualified SWE driver is required.
status: panel_and_driver_pending
panel: null
driver:
  _target_: verl.trainer.generation_sft.NativePhases
  training_python: ${oc.env:VERL_TRAIN_PYTHON,python}
  evaluator: null
every_steps: 20
full_dataset: true
max_tasks: null
include_untuned_step_zero: true
selection_metric: independently_tested_solved_count
tie_break: earlier_checkpoint
patience: 3
nll_diagnostic_only: true
allow_dev_selection: false
max_wall_seconds: 3600
episode:
  max_minutes: 5
  max_tools: 60
  max_turns: 60
grading:
  workers: 8
  max_grade_attempts: 3
  reroll_predictions: false

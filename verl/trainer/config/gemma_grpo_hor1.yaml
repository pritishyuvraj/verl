# Launch after the training-environment admission and real update qualification:
# GEMMA_PROJECT_ROOT=/pritish/workspace/gemma-post-training-kaggle
# GEMMA_RL_ROOT=$GEMMA_PROJECT_ROOT/outputs/rl/gemma-grpo-hor1-20261029
# python -m verl.trainer.main_ppo --config-name gemma_grpo_hor1
# Preparation is not an RL result. No judge calls are enabled.
defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GEMMA_RL_ROOT}/train.parquet
  val_files: ${oc.env:GEMMA_RL_ROOT}/dev.parquet
  train_batch_size: 8
  gen_batch_size: 1
  max_prompt_length: 16384
  max_response_length: 16384
  return_raw_chat: true
  truncation: error
  filter_overlong_prompts: false
  shuffle: true
  seed: 42

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
  rollout_correction:
    bypass_mode: false

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: ${oc.env:GEMMA_PROJECT_ROOT}/.runtime/models/kaggle-e4b-v2
    tokenizer_path: ${oc.env:GEMMA_PROJECT_ROOT}/.runtime/kaggle-tokenizer-e4b-v2
    weight_loader: verl.extensions.gemma.rl_head.load_model
    rl_head_chunk_size: 32
    # Reference keeps the starting step25 adapter; disabling LoRA would be a different policy.
    lora_reference_in_actor: false
    lora_adapter_path: ${oc.env:GEMMA_RL_ROOT}/initial-adapter
    lora_rank: 32
    lora_alpha: 64
    target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'
    use_remove_padding: false
    use_fused_kernels: false
    enable_gradient_checkpointing: true
    override_config:
      attn_implementation: sdpa
    lora:
      merge: false
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 32768
    grad_clip: 1.0
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    loss_agg_mode: token-mean
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 0
      weight_decay: 0.0
    fsdp_config:
      strategy: fsdp2
      fsdp_size: 2
      model_dtype: fp32
      param_offload: false
      optimizer_offload: false
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: fp32
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      strategy: fsdp2
      fsdp_size: 2
      model_dtype: fp32
      param_offload: true
  rollout:
    name: vllm
    mode: async
    nnodes: 1
    n_gpus_per_node: 6
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    # Six independent replicas; eight independent sessions per issue, not eight turns.
    n: 8
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    seed: 42
    dtype: bfloat16
    load_format: auto
    max_model_len: 32768
    max_num_batched_tokens: 32768
    max_num_seqs: 256
    gpu_memory_utilization: 0.90
    enable_chunked_prefill: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    engine_kwargs:
      vllm:
        language_model_only: true
        reasoning_parser: gemma4
        enable_auto_tool_choice: true
        tool_call_parser: gemma4
        lora_dtype: bfloat16
    val_kwargs:
      n: 1
      do_sample: true
      temperature: 1.0
      top_p: 0.95
      top_k: 64
    checkpoint_engine:
      backend: nccl
      update_weights_bucket_megabytes: 256
    agent:
      num_workers: 4
      default_agent_loop: gemma_swe
      agent_loop_config_path: ${oc.env:GEMMA_RL_ROOT}/agent-loop.yaml

trainer:
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 2
  total_epochs: 2
  total_training_steps: 2
  val_before_train: true
  test_freq: 1
  save_freq: 1
  resume_mode: disable
  logger: [console, tensorboard]
  project_name: gemma-swe-grpo
  experiment_name: hor1-step25-async-n8
  default_local_dir: ${oc.env:GEMMA_RL_ROOT}/checkpoints
  rollout_data_dir: ${oc.env:GEMMA_RL_ROOT}/rollout-text
  validation_data_dir: ${oc.env:GEMMA_RL_ROOT}/validation-text
  v1:
    trainer_mode: separate_async
    separate_async:
      num_warmup_batches: 1
      parameter_sync_step: 1
    sampler:
      max_off_policy_threshold: 1
      max_off_policy_strategy: drop

transfer_queue:
  enable: true

ray_kwargs:
  ray_init:
    address: local
    num_cpus: 32
    object_store_memory: 4294967296
    _temp_dir: ${oc.env:GEMMA_RL_ROOT}/ray
    runtime_env:
      py_executable: null

# Domain adapter settings are consumed by GemmaSWEAgentLoop, not by vLLM.
gemma_swe:
  root: ${oc.env:GEMMA_RL_ROOT}
  project_root: ${oc.env:GEMMA_PROJECT_ROOT}
  environment_admission: ${oc.env:GEMMA_RL_ROOT}/environment-admission.json
  max_active_episodes: 48
  max_active_graders: 4
  context_tokens: 32768
  thinking_tokens: 4096
  output_tokens: 16384
  enable_thinking: true
  include_thoughts: true
  episode_seconds: 300
  max_tools: 60
  max_turns: 60
  grading_seconds: 600
  stage_seconds: 21600
  judge_mode: offline
  audit_fraction_per_outcome: 0.2
  audit_seed: 42
  initial_adapter_sha256: b545e114ce31262cf455e8545b7d405b9a63fc1e9c78b3ffb4027a5bed77cf79
